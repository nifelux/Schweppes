<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schweppes — Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/styles.css"/>
  <style>
    :root{
      --primary-blue:        #2196F3;
      --primary-blue-dark:   #1977D2;
      --primary-blue-light:  #E3F2FD;
      --text-dark:           #212121;
      --white:               #FFFFFF;
      --background-light:    #F5F5F5;
      --text-muted:          #757575;
      --border-light:        #E0E0E0;
      --success-green:       #4CAF50;
      --success-green-bg:    #E8F5E9;
      --warning-orange:      #FF9800;
      --warning-orange-bg:   #FFF3E0;
      --danger-red:          #F44336;
      --danger-red-bg:       #FFEBEE;

      --shadow-sm:0 2px 10px rgba(0,0,0,0.05);
      --shadow-md:0 10px 30px rgba(0,0,0,0.08);
      --shadow-lg:0 20px 60px rgba(0,0,0,0.14);
      --shadow-blue:0 16px 40px rgba(33,150,243,0.28);

      --radius-sm:14px; --radius-md:20px; --radius-lg:28px; --radius-xl:32px;
      --ease:cubic-bezier(.22,1,.36,1);
    }
    *{box-sizing:border-box;}
    body{
      margin:0;background:var(--background-light);
      background-image:
        radial-gradient(circle at 100% 0%, rgba(33,150,243,0.10) 0%, transparent 45%),
        radial-gradient(circle at 0% 30%, rgba(25,118,210,0.05) 0%, transparent 40%);
      background-attachment:fixed;
      font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;
      color:var(--text-dark); -webkit-font-smoothing:antialiased; overflow-x:hidden;
    }
    .page-wrap{max-width:520px;margin:0 auto;padding-bottom:110px;}
    a{text-decoration:none;color:inherit;}
    button{font-family:inherit;}
    svg{stroke-linecap:round;stroke-linejoin:round;display:block;}

    .anim{opacity:0;transform:translateY(16px);}
    .anim.in{animation:riseIn .6s var(--ease) forwards;}
    @keyframes riseIn{to{opacity:1;transform:translateY(0);}}
    @media (prefers-reduced-motion: reduce){ .anim{opacity:1;transform:none;animation:none;} }

    /* ============================================================
       TOPBAR (glass, matches app-header on other pages)
       ============================================================ */
    .topbar{
      position:sticky;top:0;z-index:50;
      display:flex;align-items:center;gap:10px;
      padding:18px 20px;
      background:rgba(255,255,255,0.72);
      backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);
      border-bottom:1px solid var(--border-light);
    }
    .topbar-title{display:flex;align-items:center;gap:8px;font-family:'Fraunces',serif;font-size:18px;font-weight:700;letter-spacing:-.01em;}
    .topbar-title svg{width:19px;height:19px;stroke:var(--primary-blue);stroke-width:2;fill:none;}
    .vip-badge{
      font-size:11px;font-weight:700;letter-spacing:.03em;padding:6px 12px;border-radius:999px;
      background:linear-gradient(135deg,var(--primary-blue-light),var(--primary-blue));
      color:var(--primary-blue-dark);box-shadow:0 4px 14px rgba(33,150,243,0.35);
    }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs{display:flex;gap:9px;padding:18px 16px 6px;overflow-x:auto;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab{
      display:flex;align-items:center;gap:6px;
      flex-shrink:0;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:700;cursor:pointer;
      border:1.5px solid var(--border-light);background:var(--white);color:var(--text-muted);
      box-shadow:var(--shadow-sm);
      transition:all .2s var(--ease);
    }
    .tab svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0;}
    .tab.on{
      background:linear-gradient(135deg,var(--primary-blue),var(--primary-blue-dark));
      border-color:var(--primary-blue);color:#fff;box-shadow:0 8px 22px rgba(33,150,243,0.32);
      transform:translateY(-1px);
    }
    .tab:active{transform:scale(.95);}

    /* ============================================================
       VIP LOCK BANNER
       ============================================================ */
    .vip-lock{
      position:relative;overflow:hidden;
      background:linear-gradient(135deg,var(--primary-blue-light),#F5F9FF);
      border-radius:var(--radius-md);margin:6px 16px 18px;padding:18px 18px;
      border:1.5px solid #D0E7FF;box-shadow:var(--shadow-sm);
    }
    .vip-lock-icon{position:absolute;right:2px;bottom:-14px;width:76px;height:76px;opacity:.10;}
    .vip-lock-icon svg{width:100%;height:100%;stroke:var(--primary-blue-dark);stroke-width:1.5;fill:none;}
    .vip-lock h3{font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--primary-blue-dark);margin:0 0 5px;position:relative;z-index:1;}
    .vip-lock p{font-size:12.5px;color:var(--text-dark);line-height:1.5;margin:0;position:relative;z-index:1;}
    .vip-lock a{color:var(--primary-blue);font-weight:700;font-size:13px;display:inline-block;margin-top:8px;position:relative;z-index:1;}

    /* ============================================================
       PRODUCT CARDS (markup produced by original JS — classes unchanged)
       ============================================================ */
    .product-card{
      margin:0 16px 16px;background:var(--white);border-radius:var(--radius-lg);
      box-shadow:var(--shadow-md);border:1px solid var(--border-light);overflow:hidden;
      transition:transform .2s var(--ease);
    }
    .product-card:active{transform:scale(.985);}
    .pc-img-wrap{height:160px;background:var(--primary-blue-light);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
    .pc-img-wrap svg{width:60px;height:60px;stroke:var(--primary-blue);stroke-width:1.5;fill:none;opacity:.35;}
    .pc-body{padding:20px;}
    .pc-name{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--text-dark);margin-bottom:4px;}
    .pc-desc{font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:18px;}
    .pc-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
    .pc-stat-label{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
    .pc-stat-val{font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:var(--text-dark);}
    .pc-stat-val.profit{color:var(--success-green);}
    .pc-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:16px;border-top:1px solid var(--border-light);}
    .pc-price{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:var(--primary-blue-dark);}
    .pc-btn{
      padding:12px 24px;border-radius:14px;background:var(--primary-blue);color:#fff;
      font-weight:700;font-size:14px;box-shadow:0 8px 20px rgba(33,150,243,0.3);
      transition:all .2s var(--ease);
    }
    .pc-btn:disabled{background:var(--border-light);color:var(--text-muted);box-shadow:none;cursor:not-allowed;}
    .pc-note{font-size:11px;color:var(--text-muted);margin-top:6px;text-align:right;}
    .pc-chip{
      display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:14px;
      font-weight:700;font-size:13px;
    }
    .pc-chip svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;}
    .pc-chip.locked{background:var(--background-light);color:var(--text-muted);}
    .pc-chip.done{background:var(--success-green-bg);color:var(--success-green);}

    /* ============================================================
       BOTTOM NAVIGATION
       ============================================================ */
    .bottom-nav{
      position:fixed;bottom:0;left:0;
      width:100%;background:rgba(255,255,255,0.8);
      backdrop-filter:blur(20px) saturate(160%);
      -webkit-backdrop-filter:blur(20px) saturate(160%);
      border-top:1px solid var(--border-light);
      display:grid;grid-template-columns:repeat(4,1fr);
      padding:9px 0 24px;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.05);
    }
    .nav-item{
      display:flex;flex-direction:column;align-items:center;gap:4px;
      font-size:10px;font-weight:600;color:var(--text-muted);
      padding:6px;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent;
    }
    .nav-icon{width:21px;height:21px;stroke:currentColor;stroke-width:2;fill:none;}
    .nav-item.active{color:var(--primary-blue);}

    #toast{
      position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
      background:var(--text-dark);color:var(--white);padding:11px 20px;border-radius:30px;
      font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;
      transition:opacity .25s;white-space:nowrap;box-shadow:var(--shadow-md);
    }
    #toast.show{opacity:1;}
  </style>
</head>
<body>
<div class="page-wrap">
  <div class="topbar">
    <div class="topbar-title">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Products
    </div>
    <div style="flex:1"></div>
    <div class="vip-badge" id="vipBadge">Member</div>
  </div>

  <div class="tabs anim anim-1" id="tabsRow">
    <div class="tab on" data-tier="0">
      <svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      Newbie
    </div>
    <div class="tab" data-tier="1" data-vip-tab>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
      VIP 1
    </div>
    <div class="tab" data-tier="2" data-vip-tab>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
      VIP 2
    </div>
    <div class="tab" data-tier="3" data-vip-tab>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
      VIP 3
    </div>
    <div class="tab" data-tier="4" data-vip-tab>
      <svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/><path d="M11 3 8 9l4 12 4-12-3-6"/><path d="M2 9h20"/></svg>
      VIP 4
    </div>
  </div>

  <div id="vipLockBanner" class="vip-lock anim anim-2" style="display:none">
    <div class="vip-lock-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h3 id="lockTitle">VIP 1 Required</h3>
    <p id="lockDesc">Refer active users to unlock this tier.</p>
    <a href="team.html">View my team →</a>
  </div>

  <div id="productsList" class="anim anim-3">
    <div style="display:flex;justify-content:center;padding:40px"><div class="loader"></div></div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='dashboard.html'"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Home</button>
  <button class="nav-item active" onclick="location.href='products.html'"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>Products</button>
  <button class="nav-item" onclick="location.href='team.html'"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Team</button>
  <button class="nav-item" onclick="location.href='profile.html'"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</button>
</nav>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="assets/js/supabase.js" defer></script>
<script src="assets/js/auth.js" defer></script>
<script>
(function(){
  function waitSb(cb){if(window.sb&&window.AradelAuth){cb();return;}var t=setInterval(function(){if(window.sb&&window.AradelAuth){clearInterval(t);cb();}},50);}
  waitSb(async function(){
    var s=await window.AradelAuth.requireAuth(); if(!s)return;
    var uid=s.user.id;
    var profile=await window.AradelAuth.loadProfile(uid);
    var userVip=profile?.vip_level||0;
    document.getElementById("vipBadge").textContent=userVip>0?"VIP "+userVip:"Member";

    // ── Admin VIP kill switch — hide VIP tabs entirely when off ──
    var vipEnabled=true;
    try{
      var vr=await fetch("/api/team?action=vip-status");
      var vd=await vr.json();
      vipEnabled = vd?.ok ? !!vd.vip_enabled : true;
    }catch(e){ console.error("vip-status check failed:",e); }
    if(!vipEnabled){
      document.querySelectorAll("[data-vip-tab]").forEach(t=>t.style.display="none");
      document.getElementById("vipBadge").style.display="none";
    }

    var {data:prods}=await window.sb.from("products").select("*").order("price",{ascending:true});
    var {data:owned}=await window.sb.from("user_products").select("product_id").eq("user_id",uid);
    var ownedIds=(owned||[]).map(o=>o.product_id); // one entry per purchase — duplicates mean bought twice
    var currentTier=0;

    function purchaseCount(pid){ return ownedIds.filter(id=>id===pid).length; }

    var boxIconSvg='<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
    var lockIconSvg='<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
    var checkIconSvg='<svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';

    function render(){
      var filtered=prods.filter(p=>p.vip_level==currentTier);
      var list=document.getElementById("productsList");
      var lock=document.getElementById("vipLockBanner");

      if(currentTier > userVip){
        lock.style.display="block";
        document.getElementById("lockTitle").textContent="VIP "+currentTier+" Required";
        list.innerHTML="";
        return;
      }
      lock.style.display="none";

      list.innerHTML=filtered.map(p=>{
        var adminLocked = p.status==="locked";
        var count = purchaseCount(p.id);
        var atLimit = count>=2;
        var footerAction;
        if(adminLocked){
          footerAction = '<span class="pc-chip locked">'+lockIconSvg+' Locked by Admin</span>';
        } else if(atLimit){
          footerAction = '<span class="pc-chip done">'+checkIconSvg+' Purchased (2/2)</span>';
        } else {
          footerAction = '<button class="pc-btn" onclick="buy(this,\''+p.id+'\','+p.price+')">'+(count===1?"Buy Again":"Invest Now")+'</button>';
        }
        return `
          <div class="product-card">
            <div class="pc-img-wrap">${boxIconSvg}</div>
            <div class="pc-body">
              <div class="pc-name">${p.name}</div>
              <div class="pc-desc">${p.description||""}</div>
              <div class="pc-stats">
                <div>
                  <div class="pc-stat-label">Daily Income</div>
                  <div class="pc-stat-val profit">₦${p.daily_income.toLocaleString()}</div>
                </div>
                <div>
                  <div class="pc-stat-label">Total Return</div>
                  <div class="pc-stat-val">₦${(p.daily_income * p.duration_days).toLocaleString()}</div>
                </div>
                <div>
                  <div class="pc-stat-label">Duration</div>
                  <div class="pc-stat-val">${p.duration_days} Days</div>
                </div>
              </div>
              <div class="pc-footer">
                <div class="pc-price">₦${p.price.toLocaleString()}</div>
                ${footerAction}
              </div>
              ${count===1 && !adminLocked ? '<div class="pc-note">Purchased once — 1 more allowed</div>' : ''}
            </div>
          </div>
        `;
      }).join("");
    }

    window.buy=async function(btn,pid,price){
      if(!confirm("Invest ₦"+price.toLocaleString()+" in this product?")) return;
      btn.disabled=true; btn.textContent="Processing…";
      try{
        var {data,error}=await window.sb.rpc("purchase_product",{p_user_id:uid,p_product_id:pid});
        if(error) throw error;
        if(!data?.ok){
          var friendly = data?.error==="purchase_limit_reached"
            ? "You've already purchased this product twice — that's the limit."
            : data?.error==="vip_disabled" ? "VIP products are currently unavailable."
            : data?.error==="insufficient_balance" ? "Insufficient wallet balance."
            : (data?.error||"Purchase failed");
          throw new Error(friendly);
        }
        ownedIds.push(pid); // reflect immediately so re-render shows correct state without a refetch
        window.AradelAuth.toast("Investment successful!");
        setTimeout(()=>location.href="my-investments.html",1000);
      }catch(e){
        window.AradelAuth.toast(e.message||"Purchase failed");
        render(); // restore button state
      }
    };

    document.querySelectorAll(".tab").forEach(t=>{
      t.onclick=function(){
        if(t.style.display==="none") return; // VIP tab hidden by kill switch
        document.querySelector(".tab.on").classList.remove("on");
        t.classList.add("on");
        currentTier=parseInt(t.dataset.tier);
        render();
      };
    });
    render();
    document.querySelectorAll(".anim").forEach((el,i)=>setTimeout(()=>el.classList.add("in"),80*i));
  });
})();
</script>
</body>
</html>
